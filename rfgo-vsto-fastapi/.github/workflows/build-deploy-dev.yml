name: Build and Deploy (FastAPI) - DEV

on:
  push:
    branches: [ develop ]
    paths:
      - 'rfgo-vsto-fastapi/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: k8s-arc-runner
    steps:
    - uses: actions/checkout@v4

    - name: Login to Harbor
      uses: docker/login-action@v3
      with:
        registry: harbor.internal
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./rfgo-vsto-fastapi
        push: true
        tags: harbor.foundrymtc.samsungds.net/refgo/rfgo-vsto-fastapi:dev-${{ github.sha }}
        build-args: |
          PIP_INDEX_URL=${{ secrets.INTERNAL_PYPI_MIRROR }}
          PIP_TRUSTED_HOST=${{ secrets.INTERNAL_PYPI_TRUSTED_HOST }}

    - name: Checkout Deploy Repository
      uses: actions/checkout@v4
      with:
        repository: refgo/rfgo-deploy
        token: ${{ secrets.GHA_TOKEN }}
        path: deploy-repo
        ref: main

    - name: Update Image Tag
      run: |
        sed -i 's/tag: .*/tag: "dev-${{ github.sha }}"/' deploy-repo/values/services/dev/fastapi.yaml
        
    - name: Commit and Push Manifest Change
      run: |
        cd deploy-repo
        git config --global user.name "GHA Runner (Dev)"
        git config --global user.email "gha-dev@internal"
        git add values/services/dev/fastapi.yaml
        git commit -m "chore(deploy): update fastapi dev image to dev-${{ github.sha }}"
        git push origin main
