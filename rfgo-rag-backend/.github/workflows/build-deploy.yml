name: Build and Deploy (RAG Backend)

on:
  push:
    branches: [ main ]
    paths:
      - 'rfgo-rag-backend/**'

jobs:
  build:
    runs-on: k8s-arc-runner 

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: kubernetes

    - name: Login to Harbor
      uses: docker/login-action@v3
      with:
        registry: harbor.foundrymtc.samsungds.net
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./rfgo-rag-backend
        file: ./rfgo-rag-backend/Dockerfile.airtight
        push: true
        tags: harbor.foundrymtc.samsungds.net/refgo/rfgo-rag-backend:${{ github.sha }}
        build-args: |
          HTTP_PROXY=${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}

    - name: Update Image Tag
      run: |
        sed -i 's/tag: .*/tag: "${{ github.sha }}"/' rfgo-deploy/values/services/rag.yaml
        
    - name: Commit and Push Manifest Change
      run: |
        git config --global user.name "GHA Runner"
        git config --global user.email "gha@internal"
        git add rfgo-deploy/values/services/rag.yaml
        git commit -m "chore(deploy): update rag-backend image to ${{ github.sha }}"
        git push origin main
