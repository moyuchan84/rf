apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rfgo-web-prod
  namespace: argocd
spec:
  project: default
  sources:
    # 1. 공통 Helm Chart (템플릿)
    - repoURL: 'https://github.com/refgo/rfgo-deploy.git' # TODO: 실제 레포 주소로 수정
      targetRevision: main
      path: charts/rfgo-service
    # 2. 설정 파일 (Values)
    - repoURL: 'https://github.com/refgo/rfgo-deploy.git' # TODO: 실제 레포 주소로 수정
      targetRevision: main
      ref: values-repo
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: refgo-prod
  template:
    helm:
      valueFiles:
        - '$values-repo/values/env/prod.yaml'      # 운영 환경 공통 설정
        - '$values-repo/values/services/nestjs.yaml' # 서비스별 오버라이드
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
