apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rfgo-rag-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/refgo/rfgo-deploy.git'
    targetRevision: main
    path: charts/rfgo-service
    helm:
      valueFiles:
        - '../../values/env/prod.yaml'
        - '../../values/services/common/rag.yaml'
        - '../../values/services/prod/rag.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: refgo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
