apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rfgo-nestjs-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/refgo/rfgo-deploy.git'
    targetRevision: main
    path: charts/rfgo-service
    helm:
      valueFiles:
        - '../../values/env/dev.yaml'
        - '../../values/services/common/nestjs.yaml'
        - '../../values/services/dev/nestjs.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: refgo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
