{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.nameOverride | default .Release.Name }}
  labels:
    app: {{ .Values.nameOverride | default .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | default "envoy-gateway" }}
      namespace: {{ .Values.gateway.namespace | default "envoy-gateway-system" }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.nameOverride | default .Release.Name }}
          port: {{ .Values.service.port }}
{{- end }}
